# Theme — ported from hyprtheme.conf
# Variables follow the original HyDE palette (Catppuccin-ish).

# Geometry
default_border pixel 2
default_floating_border pixel 2
gaps inner 5
gaps outer 10
smart_borders no_gap
smart_gaps off

# SwayFX rounded corners (ignored on vanilla sway)
# corner_radius 10

# Colors — class       border    backgr.   text      indicator child_border
client.focused          #B4A1DB   #1e2030   #F1FCF9   #D04E9D   #B4A1DB
client.focused_inactive #1e2030   #1e2030   #F1FCF9   #1e2030   #1e2030
client.unfocused        #1e2030   #1e2030   #888888   #1e2030   #1e2030
client.urgent           #DB695B   #1e2030   #F1FCF9   #DB695B   #DB695B
client.placeholder      #1e2030   #1e2030   #F1FCF9   #1e2030   #1e2030
client.background       #1e2030

# Font
font pango:JetBrainsMono Nerd Font 10
title_align center
