# Keybindings — ported from hyprland.conf
# $mod = Super, $alt = Mod1.

### Terminal
bindsym $mod+Return       exec $term
bindsym $mod+Shift+Return exec $term -f
bindsym $mod+$alt+Return  exec $term -s
bindsym $mod+t            exec $term -F

### Apps
bindsym $mod+n        exec $files
bindsym $mod+Shift+e  exec $editor
bindsym $mod+Shift+w  exec $browser

### Launchers (rofi) — macOS-style Cmd+Space as Spotlight
bindsym $mod+space    exec $menu
bindsym $mod+d        exec $menu
bindsym $mod+r        exec $runner
bindsym $mod+Shift+u  exec $musicmenu
bindsym $mod+Shift+n  exec $netmenu
bindsym $mod+x        exec $powermenu
bindsym $mod+a        exec $screenshotmenu

### Misc
bindsym $mod+p        exec $colorpicker
bindsym $mod+e        exec $emojipicker
bindsym Ctrl+$alt+l   exec $lockscreen
bindsym $mod+Shift+b  exec $background_swap
bindsym $mod+Shift+y  exec $screen_mode
bindsym $mod+Shift+i  exec $cheatsheet

### Function keys
bindsym XF86MonBrightnessUp   exec $backlight --inc
bindsym XF86MonBrightnessDown exec $backlight --dec
bindsym XF86AudioRaiseVolume  exec $volume --inc
bindsym XF86AudioLowerVolume  exec $volume --dec
bindsym XF86AudioMute         exec $volume --toggle
bindsym XF86AudioMicMute      exec $volume --toggle-mic
bindsym XF86AudioNext         exec playerctl next
bindsym XF86AudioPrev         exec playerctl previous
bindsym XF86AudioPlay         exec playerctl play
bindsym XF86AudioStop         exec playerctl pause

### Screenshots
bindsym         Print exec $screenshot --now
bindsym $alt+   Print exec $screenshot --in5
bindsym Shift+  Print exec $screenshot --in10
bindsym Ctrl+   Print exec $screenshot --win
bindsym $mod+   Print exec $screenshot --area

### Window management — macOS-style (⌘+W close, ⌘+Q quit, ⌘+H/M hide, ⌘+F fullscreen)
bindsym $mod+w              kill
bindsym $mod+q              kill
bindsym Ctrl+$alt+Delete    exec swaymsg exit
bindsym $mod+f              fullscreen toggle
bindsym $mod+Shift+f        floating toggle
bindsym $mod+Ctrl+space     floating toggle, move position center
# Hide / minimize (scratchpad acts as a dock)
bindsym $mod+h              move scratchpad
bindsym $mod+m              move scratchpad
bindsym $mod+Shift+h        scratchpad show
bindsym $mod+grave          scratchpad show

# Focus
bindsym $mod+Left  focus left
bindsym $mod+Right focus right
bindsym $mod+Up    focus up
bindsym $mod+Down  focus down

# Move
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Down  move down

# Resize
bindsym $mod+Ctrl+Left  resize shrink width 20px
bindsym $mod+Ctrl+Right resize grow   width 20px
bindsym $mod+Ctrl+Up    resize shrink height 20px
bindsym $mod+Ctrl+Down  resize grow   height 20px

# Move floating window
bindsym $mod+$alt+Left  exec swaymsg "move position $(swaymsg -t get_tree | jq -r '..|select(.focused?==true)|.rect|"\(.x - 20) \(.y)"')"
bindsym $mod+$alt+Right exec swaymsg "move position $(swaymsg -t get_tree | jq -r '..|select(.focused?==true)|.rect|"\(.x + 20) \(.y)"')"
bindsym $mod+$alt+Up    exec swaymsg "move position $(swaymsg -t get_tree | jq -r '..|select(.focused?==true)|.rect|"\(.x) \(.y - 20)"')"
bindsym $mod+$alt+Down  exec swaymsg "move position $(swaymsg -t get_tree | jq -r '..|select(.focused?==true)|.rect|"\(.x) \(.y + 20)"')"

bindsym $mod+Tab        focus next
bindsym $mod+Shift+Tab  focus prev

### Workspace navigation — macOS-style Control+Arrow
bindsym Ctrl+Left   workspace prev
bindsym Ctrl+Right  workspace next
# Overview (Mission Control approx) — rofi window switcher
bindsym Ctrl+Up     exec rofi -show window

### Workspaces — numeric + French AZERTY top row
set $ws1 1
set $ws2 2
set $ws3 3
set $ws4 4
set $ws5 5
set $ws6 6
set $ws7 7
set $ws8 8
set $ws9 9
set $ws10 10

bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace $ws10

bindcode $mod+10 workspace $ws1
bindcode $mod+11 workspace $ws2
bindcode $mod+12 workspace $ws3
bindcode $mod+13 workspace $ws4
bindcode $mod+14 workspace $ws5
bindcode $mod+15 workspace $ws6
bindcode $mod+16 workspace $ws7
bindcode $mod+17 workspace $ws8
bindcode $mod+18 workspace $ws9
bindcode $mod+19 workspace $ws10

bindsym $mod+Shift+1 move container to workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7
bindsym $mod+Shift+8 move container to workspace $ws8
bindsym $mod+Shift+9 move container to workspace $ws9
bindsym $mod+Shift+0 move container to workspace $ws10

### Pin (sticky) — sway equivalent of Hyprland `pin`
bindsym $mod+Shift+p sticky toggle

### Reload waybar themes script
bindsym $mod+Shift+t exec ~/.config/waybar/scripts/swap.sh
